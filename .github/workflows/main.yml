name: MCP-ZERO CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  offline-first-resilience-test:
    name: Offline-First Resilience Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e .[testing]
          
      - name: Test offline-first resilience pattern
        run: |
          echo "Running offline resilience tests - ensuring all components follow the single-connection-attempt pattern"
          python -m pytest tests/offline_resilience/test_offline_mode.py -v
          
      - name: Verify default offline mode for DBMemoryTree
        run: |
          echo "Verifying DBMemoryTree starts in offline mode by default"
          python -m pytest tests/components/test_memory_tree.py::TestDBMemoryTreeOfflineDefault -v

  zeta-components:
    name: ZETA Components Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Install CUDA dependencies (mock for CI)
        run: |
          echo "Installing CUDA mock dependencies for testing"
          mkdir -p $HOME/.local/cuda-mock
          echo "export CUDA_HOME=$HOME/.local/cuda-mock" >> $GITHUB_ENV
          
      - name: Install dependencies with ZETA
        run: |
          python -m pip install --upgrade pip
          pip install -e .[zeta,testing]
          
      - name: Build ZETACUDA
        run: |
          cd components/zetacuda
          cargo build --features mock-cuda
          
      - name: Test ZETA components with offline resilience
        run: |
          python -m pytest tests/components/test_zetacuda.py -v
          python -m pytest tests/components/test_zetatensor.py -v
          python -m pytest tests/components/test_zetaface.py -v
          python -m pytest tests/components/test_zeta_llm.py -v

  contract-system:
    name: Contract Burn System Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.2.3'
          
      - name: Install dependencies with Terraform
        run: |
          python -m pip install --upgrade pip
          pip install -e .[terraform,testing]
          
      - name: Test contract burn system
        run: |
          python -m pytest tests/contracts/test_burn_contracts.py -v
          python -m pytest tests/contracts/test_validation.py -v
          
      - name: Test Terraform integration
        run: |
          cd tests/terraform
          terraform init
          terraform validate
          python -m pytest test_terraform_integration.py -v

  healthcare-revolution-demo:
    name: Healthcare Revolution Demo Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e .[testing]
          
      - name: Test ZetaCore demo offline operation
        run: |
          cd demo/healthcare-revolution
          python run_zetacore_demo.py --test-resilience
          
      - name: Test visualizations export
        run: |
          cd demo/healthcare-revolution
          python run_zetacore_demo.py --patient "P001" --visualize-only --export-svg --output-dir ./test_output
          ls -la ./test_output
          test -f ./test_output/risk_radar.svg
          test -f ./test_output/trajectory_timeline.svg

  build-and-publish:
    name: Build and Publish Package
    runs-on: ubuntu-latest
    needs: [offline-first-resilience-test, zeta-components, contract-system, healthcare-revolution-demo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          
      - name: Build package
        run: |
          python -m build
          
      - name: Create offline installation package
        run: |
          mkdir -p mcp-zero-offline
          cp -r dist/* mcp-zero-offline/
          cp install_offline.sh mcp-zero-offline/
          tar -czf mcp-zero-offline-$(python setup.py --version).tar.gz mcp-zero-offline
          
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
            mcp-zero-offline-*.tar.gz
