name: MCP-ZERO Docs

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.md'
      - 'LICENSE'
      - '**/*.svg'
      - '**/*.gif'
      - '**/*.png'
      - '**/*.jpg'
  pull_request:
    branches: [ master ]
    paths:
      - '**/*.md'
      - 'LICENSE'
      - '**/*.svg'
      - '**/*.gif'
      - '**/*.png'
      - '**/*.jpg'

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Documentation update detected
      run: |
        echo "Documentation-only changes detected."
        echo "Skipping code-related checks for documentation updates."
        
    - name: Verify README
      run: |
        echo "Verifying README.md and other documentation files..."
        if [ -f README.md ]; then
          echo "README.md exists and is valid."
        fi
        
        # Count and display documentation files
        DOC_FILES=$(find . -name "*.md" | wc -l)
        echo "Found $DOC_FILES documentation files in the repository."
        echo "Documentation CI passed successfully!"
