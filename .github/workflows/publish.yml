name: MCP-ZERO PyPI Publish

on:
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Create offline resilience lock file
      run: |
        echo "MCP-ZERO PyPI publish with offline-first resilience" > pypi_publish.lock
        echo "Starting publish at $(date)" >> pypi_publish.lock
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        echo "Dependencies installed with offline-first resilience" >> pypi_publish.lock
        
    - name: Build package
      run: |
        # Create offline-first package with immutable contract bindings
        echo "Building package with offline-first resilience" >> pypi_publish.lock
        python -m build
        echo "Package built successfully at $(date)" >> pypi_publish.lock
        
        # Create the offline installation archive
        VERSION=$(grep -o 'version = "[^"]*"' setup.py | cut -d'"' -f2)
        mkdir -p mcp-zero-offline-$VERSION
        cp dist/* mcp-zero-offline-$VERSION/
        cp -r src mcp-zero-offline-$VERSION/
        cp setup.py README.md LICENSE MANIFEST.in mcp-zero-offline-$VERSION/
        cp -r requirements.txt mcp-zero-offline-$VERSION/ || echo "No requirements.txt found"
        
        # Create offline installation script
        cat > mcp-zero-offline-$VERSION/install_offline.sh << 'EOF'
#!/bin/bash
echo "MCP-ZERO offline installation with immutable contract validation" > install.lock
echo "Starting installation at $(date)" >> install.lock
pip install *.whl
echo "Offline installation completed successfully" >> install.lock
chmod +x burn.sh
EOF
        chmod +x mcp-zero-offline-$VERSION/install_offline.sh
        
        # Create the tarball
        tar -czf mcp-zero-offline-$VERSION.tar.gz mcp-zero-offline-$VERSION
        echo "Created offline installation package for air-gapped environments" >> pypi_publish.lock
        
    - name: Single-attempt PyPI publish with permanent fallback
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip_existing: true
        
    - name: Create permanent fallback record
      run: |
        echo "PyPI publish completed (or already exists) at $(date)" >> pypi_publish.lock
        echo "Permanent offline fallback installation package available" >> pypi_publish.lock
        
    - name: Upload offline installation package
      uses: actions/upload-artifact@v3
      with:
        name: mcp-zero-offline-package
        path: mcp-zero-offline-*.tar.gz
