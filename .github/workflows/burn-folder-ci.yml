name: MCP-ZERO Burn Folder CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'burn.sh'
      - 'templates/**'
      - '.github/workflows/burn-folder-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'burn.sh'
      - 'templates/**'
      - '.github/workflows/burn-folder-ci.yml'
  workflow_dispatch:

jobs:
  verify-burn-folder:
    runs-on: ubuntu-latest
    
    env:
      OFFLINE_FIRST: 1
      CI: true
      SINGLE_CONNECTION_ATTEMPT: 1
      PERMANENT_FALLBACK: 1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install minimal dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          pip install PyYAML requests
          
      - name: Make scripts executable
        run: |
          chmod +x burn.sh
          chmod +x verify_burn_folder.sh
          find templates -name "*.sh" -exec chmod +x {} \;
          find templates -name "*.py" -exec chmod +x {} \;
      
      - name: Create test burn folder
        run: |
          ./burn.sh --offline --docker --agents --terraform --burn-contracts --ci /tmp/test-burn
      
      - name: Verify burn folder
        run: |
          ./verify_burn_folder.sh /tmp/test-burn
      
      - name: Upload lock files for audit
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: burn-lock-files
          path: |
            /tmp/test-burn/burn.lock
            /tmp/test-burn/.mcp/locks/*.lock
            /tmp/test-burn/burned_contracts/*.lock
  
  healthcare-agent-integration:
    runs-on: ubuntu-latest
    needs: verify-burn-folder
    
    env:
      OFFLINE_FIRST: 1
      CI: true
      SINGLE_CONNECTION_ATTEMPT: 1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install minimal dependencies
        run: |
          pip install PyYAML requests
          
      - name: Make scripts executable
        run: |
          chmod +x burn.sh
          chmod +x demo/healthcare-agent/burn.sh
          find templates -name "*.sh" -exec chmod +x {} \;
          find templates -name "*.py" -exec chmod +x {} \;
      
      - name: Create healthcare agent
        run: |
          cd demo/healthcare-agent
          ./burn.sh --ci
      
      - name: Verify contracts
        run: |
          python3 templates/burn_contracts.py \
            --contracts-dir=demo/healthcare-agent/contracts \
            --burn-dir=demo/healthcare-agent/burned_contracts \
            --verify-only
      
      - name: Upload healthcare agent artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: healthcare-agent-artifacts
          path: |
            demo/healthcare-agent/healthcare_burn.lock
            demo/healthcare-agent/burned_contracts/*.lock
            demo/healthcare-agent/fallback.log

  contract-burning-tests:
    runs-on: ubuntu-latest
    
    env:
      OFFLINE_FIRST: 1
      CI: true
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install minimal dependencies
        run: |
          pip install PyYAML pytest pytest-cov
          
      - name: Create test contracts
        run: |
          mkdir -p test/contracts
          mkdir -p test/burned_contracts
          
          cat > test/contracts/test_contract1.yml << EOF
          name: test_agent
          type: agent
          version: 1.0
          created_at: $(date -Iseconds)
          
          resources:
            memory: 512Mi
            cpu: 0.5
          
          capabilities:
            - memory
            - reasoning
          
          offline_mode:
            enabled: true
            fallback_strategy: local_processing
          EOF
          
          cat > test/contracts/test_contract2.yml << EOF
          name: test_service
          type: service
          version: 1.0
          created_at: $(date -Iseconds)
          
          endpoints:
            - /api/v1/memory
            - /api/v1/reasoning
          
          offline_mode:
            enabled: true
          EOF
      
      - name: Run contract burner
        run: |
          python3 templates/burn_contracts.py \
            --contracts-dir=test/contracts \
            --burn-dir=test/burned_contracts \
            --terraform-dir=test
      
      - name: Verify burned contracts
        run: |
          python3 templates/burn_contracts.py \
            --contracts-dir=test/contracts \
            --burn-dir=test/burned_contracts \
            --verify-only
      
      - name: Upload contract artifacts
        uses: actions/upload-artifact@v3
        with:
          name: contract-burn-artifacts
          path: |
            test/burned_contracts/*.lock
            test/*.tf
