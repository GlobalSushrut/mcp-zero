name: MCP-ZERO CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Rust Kernel (build + test)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          src/kernel/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('src/kernel/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Build
      working-directory: src/kernel
      run: cargo build --release

    - name: Test
      working-directory: src/kernel
      run: cargo test

  go:
    name: Go Gateway (build + test)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache-dependency-path: src/gateway/go.sum

    - name: Build
      working-directory: src/gateway
      run: go build -o gateway .

    - name: Test
      working-directory: src/gateway
      run: go test -v ./...
